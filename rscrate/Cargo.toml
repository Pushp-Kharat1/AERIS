[workspace]
resolver = "2"
members = [
    "aeris-core",
    "aeris-risk",
    "aeris-feed",
    "aeris-execution",
    "aeris-ipc",
    "aeris-strategy",
    "aeris-node",
    "aeris-gd",
    "aeris-backtest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pushp Kharat <pushp@pkboost.co.in>"]
license = "MPL-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
